<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoleyGest - Registro</title>
<link rel="stylesheet" href="css/EstiloLogin.css">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<link rel="icon" type="imagen/x-icon" href="imagen/Logo.png">
</head>
<body style="background-image: url('imagen/Fondo.png'); background-repeat: no-repeat;">
<div class="wrapper">
    <form id="formRegistro" onsubmit="registrarCuenta(event)">
        <img src="imagen/Logo.png" class="Logo" alt="Logo">
        <h1>REGISTRARSE</h1>
        
        <div class="input-box">
            <input type="text" id="usuario" placeholder="Usuario" required>
            <i class='bx bxs-user'></i>
        </div>
        
        <div class="input-box">
            <input type="email" id="correo" placeholder="Correo Electrónico" required>
            <i class='bx bxs-envelope'></i>
        </div>
        
        <div class="input-box">
            <input type="password" id="contraseña" placeholder="Contraseña" required>
            <i class='bx bxs-lock-alt'></i>
        </div>
        
        <div class="input-box">
            <input type="password" id="confirmar-contraseña" placeholder="Confirmar Contraseña" required>
            <i class='bx bxs-lock-alt'></i>
        </div>

        <div class="remember-forgot">
            <label>
                <input type="checkbox" required> Acepto los<br>términos y condiciones
            </label>
        </div>

        <button type="submit" class="btn">Registrarse</button>
        
        <div class="register-link">
            <p>¿Ya tienes una cuenta? <a href="index.html">Iniciar Sesión</a></p>
        </div>
    </form>
</div>

<script>
async function registrarCuenta(event) {
    event.preventDefault();
    const user = document.getElementById('usuario').value.trim();
    const email = document.getElementById('correo').value.trim();
    const pass = document.getElementById('contraseña').value.trim();
    const confirmPass = document.getElementById('confirmar-contraseña').value.trim();

    if (pass !== confirmPass) {
        alert('Las contraseñas no coinciden.');
        return;
    }

    try {
        // Intentamos guardar directamente en Supabase
        const { error } = await supabaseClient
            .from('usuarios')
            .insert([
                {
                    usuario: user,
                    correo: email,
                    password: pass,
                    rol: 'Jugador'
                }
            ]);

        if (error) {
            // Si el usuario ya existe en Supabase, avisamos de forma clara
            alert('El nombre de usuario ya está en uso. Prueba con otro.');
            return;
        }

        alert('¡Cuenta registrada con éxito! Ya puedes iniciar sesión.');
        window.location.href = 'index.html';

    } catch (err) {
        console.error('Error:', err);
        alert('Error al registrar la cuenta.');
    }
}
</script>

<!-- Scripts externos corregidos -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
