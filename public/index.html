<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoleyGest</title>
<link rel="stylesheet" href="css/EstiloLogin.css">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<link rel="icon" type="imagen/x-icon" href="imagen/Logo.png">
</head>
<body style="background-image: url('imagen/Fondo.png'); background-repeat: no-repeat;">
<div class="wrapper">
    <form id="formLogin" onsubmit="iniciarSesion(event)">
        <img src="imagen/Logo.png" class="Logo" alt="Logo">
        <h1>INICIAR SESIÓN</h1>
        
        <div class="input-box">
            <input type="text" id="usuario" placeholder="Usuario" required>
            <i class='bx bxs-user'></i>
        </div>
        
        <div class="input-box">
            <input type="password" id="contraseña" placeholder="Contraseña" required>
            <i class='bx bxs-lock-alt'></i>
        </div>

        <button type="submit" class="btn">Ingresar</button>
        
        <div class="register-link">
            <p>No tengo una cuenta <a href="Registro.html">Registrarme</a></p>
        </div>
    </form>
</div>

<script>
async function iniciarSesion(event) {
    event.preventDefault();
    const user = document.getElementById('usuario').value.trim();
    const pass = document.getElementById('contraseña').value.trim();

    try {
        const { data, error } = await supabaseClient
            .from('usuarios')
            .select('*')
            .eq('usuario', user)
            .eq('password', pass)
            .single();

        if (error || !data) {
            alert('Usuario o contraseña incorrectos.');
            return;
        }

        alert('¡Bienvenido de nuevo, ' + data.usuario + '!');
        window.location.href = 'Panel.html';

    } catch (err) {
        console.error('Error de inicio de sesión:', err);
        alert('Error al conectar con la base de datos.');
    }
}
</script>

<!-- Scripts externos corregidos -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
